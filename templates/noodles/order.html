{% extends 'noodles/layout.html' %}
{% block title %}Order - NoodleNest{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto px-8 py-12">
    <h2 class="text-3xl font-bold text-center text-red-700 mb-8">Place Your Order </h2>
    <form method="POST" class="bg-white rounded-xl shadow-md p-6 space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-red-700 text-white font-bold py-2 rounded-lg hover:bg-red-800 transition duration-200">
            Submit Order
        </button>
    </form>
</div>
{% endblock %}
