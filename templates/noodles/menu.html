{% extends 'noodles/layout.html' %}
{% block title %}Menu - NoodleNest{% endblock %}
{% block content %}
<div class="px-8 py-12">
    <h2 class="text-3xl font-bold text-center text-red-700 mb-10">Our Popular Noodles </h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8">
        {% for noodle in noodles %}
        <div class="bg-white rounded-xl shadow-md p-4 hover:shadow-lg transition duration-200">
            <img src="{{ noodle.image.url }}" alt="{{ noodle.name }}" class="w-full h-40 object-cover rounded-lg mb-4">
            <h3 class="text-lg font-semibold text-gray-800">{{ noodle.name }}</h3>
            <p class="text-sm text-gray-500">{{ noodle.description }}</p>
            <p class="text-red-700 font-bold mt-2">Rs. {{ noodle.price }}</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
